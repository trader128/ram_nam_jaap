name: bhakti
description: "भक्ति — नाम जप, पंचांग और भजन के लिए दैनिक भक्ति साथी।"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.1.0
  fl_chart: ^0.70.2
  volume_controller: ^3.4.1
  sensors_plus: ^7.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  background_color_ios: "#3A0A05"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/sounds/mala_complete.wav
    - assets/sounds/chants/
    - assets/music/
    - assets/images/deities/
    - assets/content/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
